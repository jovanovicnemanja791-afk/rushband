<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Galerija – Rush Band</title>
<link rel="icon" href="assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}body{margin:0;background:#f4f3ef;font-family:'Archivo',sans-serif}
a{color:#0d0d0e;text-decoration:none}*{box-sizing:border-box}
@media(max-width:820px){.gg{grid-template-columns:repeat(2,1fr)!important;gap:10px!important}.gp{padding:110px 16px 56px!important}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</helmet>
<div style="background:#f4f3ef;color:#0d0d0e;font-family:'Archivo',sans-serif;min-height:100vh;overflow-x:hidden">
<header style="position:fixed;top:14px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 16px">
<div style="width:100%;max-width:1020px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 14px;background:rgba(40,40,44,.85);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:22px;color:#fff">
<a href="index.html" style="display:flex"><img src="assets/logo.png" alt="Rush Band" style="width:64px;height:64px;margin:-8px 0;object-fit:cover;border-radius:50%"></a>
<a href="index.html" style="display:flex;align-items:center;gap:8px;background:#c6e22a;color:#0d0d0e;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:12px 20px;border-radius:999px;white-space:nowrap" style-hover="background:#fff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Nazad na sajt</a>
</div>
</header>
<main class="gp" style="max-width:1160px;margin:0 auto;padding:150px 24px 90px">
<div style="color:rgba(13,13,14,.6);font-size:12px;font-weight:800;letter-spacing:.28em;text-transform:uppercase">Galerija</div>
<h1 style="margin:16px 0 40px;font-size:clamp(40px,7vw,84px);font-weight:900;line-height:1;letter-spacing:-.03em">Slike sa nastupa</h1>
<div class="gg" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<sc-for list="{{ photos }}" as="p" hint-placeholder-count="8">
<button type="button" onClick="{{ p.open }}" aria-label="Otvori sliku {{ p.n }}" style="display:block;padding:0;border:1px solid rgba(13,13,14,.15);border-radius:18px;overflow:hidden;cursor:zoom-in;aspect-ratio:3/4;background:#2a2a2d url(assets/hero.jpg) {{ p.pos }}/auto 210% no-repeat;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s" style-hover="transform:translateY(-6px);box-shadow:0 22px 40px -18px rgba(0,0,0,.45)"></button>
</sc-for>
</div>
</main>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ close }}" style="position:fixed;inset:0;z-index:100;background:rgba(13,13,14,.94);display:flex;align-items:center;justify-content:center;padding:24px">
<div onClick="{{ stop }}" style="width:min(90vw,calc(80vh*.75));aspect-ratio:3/4;border-radius:18px;background:#2a2a2d url(assets/hero.jpg) {{ curPos }}/auto 210% no-repeat"></div>
<button type="button" onClick="{{ close }}" aria-label="Zatvori" style="position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer" style-hover="background:#c6e22a;color:#0d0d0e;border-color:#c6e22a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
<button type="button" onClick="{{ prev }}" aria-label="Prethodna" style="position:absolute;left:18px;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer" style-hover="background:#c6e22a;color:#0d0d0e;border-color:#c6e22a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
<button type="button" onClick="{{ next }}" aria-label="Sledeća" style="position:absolute;right:18px;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer" style-hover="background:#c6e22a;color:#0d0d0e;border-color:#c6e22a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cur: -1 };
  P = ["22% 22%","37% 22%","49% 22%","60% 22%","87% 25%","47% 50%","74% 50%","10% 30%"];
  componentDidMount() {
    this._k = e => { if (this.state.cur < 0) return; if (e.key === "Escape") this.setState({ cur: -1 }); if (e.key === "ArrowRight") this.go(1); if (e.key === "ArrowLeft") this.go(-1); };
    window.addEventListener("keydown", this._k);
  }
  componentWillUnmount() { window.removeEventListener("keydown", this._k); }
  go(d) { this.setState(s => ({ cur: (s.cur + d + this.P.length) % this.P.length })); }
  renderVals() {
    const c = this.state.cur;
    return {
      photos: this.P.map((pos, i) => ({ pos, n: i + 1, open: () => this.setState({ cur: i }) })),
      isOpen: c >= 0, curPos: c >= 0 ? this.P[c] : "50% 50%",
      close: () => this.setState({ cur: -1 }), stop: e => e.stopPropagation(),
      prev: e => { e.stopPropagation(); this.go(-1); }, next: e => { e.stopPropagation(); this.go(1); }
    };
  }
}
</script>
</body>
</html>
